<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QA build 57 harness</title>
<style>
  html,body{margin:0;padding:0;background:#111;color:#eee;font:13px/1.35 -apple-system,system-ui,sans-serif}
  #banner{padding:6px 8px;font:700 13px/1.25 -apple-system,system-ui,sans-serif;
    background:#444;color:#fff;position:sticky;top:0;z-index:5}
  #banner.pass{background:#0a7c2f}
  #banner.fail{background:#b00020}
  #log{padding:6px 8px;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
  #log .ok{color:#7ee787}
  #log .bad{color:#ff8a8a}
  #dump{padding:6px 8px;font:12px/1.35 ui-monospace,Menlo,monospace;white-space:pre-wrap;
    word-break:break-word;background:#000;color:#d8f5ff;border-top:2px solid #333}
  iframe{display:block;width:100%;border:0;background:#000}
</style>
</head>
<body>
<div id="banner">QA57 — running…</div>
<div id="log"></div>
<div id="dump" hidden></div>
<iframe id="app" src="about:blank" title="app under test"></iframe>
<script>
(function () {
  "use strict";
  window.__qa = { errors: [] };
  var QS = new URLSearchParams(location.search);
  var stage = QS.get("stage") || "1";
  var banner = document.getElementById("banner");
  var logEl = document.getElementById("log");
  var dumpEl = document.getElementById("dump");
  var frame = document.getElementById("app");
  var checks = [];

  function log(s, cls) {
    var d = document.createElement("div");
    if (cls) d.className = cls;
    d.textContent = s;
    logEl.appendChild(d);
  }
  function check(name, pass, detail) {
    checks.push({ name: name, pass: !!pass, detail: detail || "" });
    log((pass ? "PASS " : "FAIL ") + name + (detail ? " :: " + detail : ""), pass ? "ok" : "bad");
  }
  function finish() {
    var bad = checks.filter(function (c) { return !c.pass; });
    banner.className = bad.length ? "fail" : "pass";
    banner.textContent = "stage " + stage + " — " + (bad.length
      ? ("FAIL (" + bad.length + "/" + checks.length + "): " + bad.map(function (c) { return c.name; }).join(", "))
      : ("PASS " + checks.length + "/" + checks.length));
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function waitFor(fn, ms, label) {
    var t0 = Date.now();
    return new Promise(function (res, rej) {
      (function tick() {
        var v;
        try { v = fn(); } catch (e) { v = null; }
        if (v) return res(v);
        if (Date.now() - t0 > (ms || 15000)) return rej(new Error("timeout: " + (label || "condition")));
        setTimeout(tick, 100);
      })();
    });
  }
  function wipeStorage() {
    var ks = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf("optimalfit.") === 0) ks.push(k);
    }
    ks.forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
    return ks.length;
  }
  async function cleanupSW() {
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        var rs = await navigator.serviceWorker.getRegistrations();
        for (var i = 0; i < rs.length; i++) { try { await rs[i].unregister(); } catch (e) {} }
      }
    } catch (e) {}
    try {
      if (window.caches && caches.keys) {
        var ns = await caches.keys();
        for (var j = 0; j < ns.length; j++) { try { await caches.delete(ns[j]); } catch (e) {} }
      }
    } catch (e) {}
  }

  var STUB = '<scr' + 'ipt>(function(){' +
    'try{if(navigator.serviceWorker){navigator.serviceWorker.register=function(){return new Promise(function(){});};}}catch(e){}' +
    'window.onerror=function(m,s,l){try{parent.__qa.errors.push("onerror: "+m+" @"+(s||"")+":"+l);}catch(_){}};' +
    'window.addEventListener("unhandledrejection",function(ev){try{parent.__qa.errors.push("rejection: "+((ev.reason&&ev.reason.message)||ev.reason));}catch(_){}});' +
    'var ce=console.error;console.error=function(){try{parent.__qa.errors.push("console.error: "+Array.prototype.map.call(arguments,function(a){return String(a);}).join(" "));}catch(_){}ce.apply(console,arguments);};' +
    '})();</scr' + 'ipt>';

  async function boot() {
    var res = await fetch("index.html?qa=" + Date.now(), { cache: "no-store" });
    var html = await res.text();
    if (html.indexOf("<head>") < 0) throw new Error("no <head> in index.html");
    html = html.replace("<head>", "<head>" + STUB);
    var d = frame.contentDocument;
    d.open(); d.write(html); d.close();
    var W = frame.contentWindow;
    await waitFor(function () {
      return W.OF && W.OF.APP_VERSION && frame.contentDocument.querySelector(".hero-ring, #dash-hero");
    }, 20000, "app boot");
    await sleep(700);
    // dismiss the first-run tour
    var ob = frame.contentDocument.getElementById("ob-close");
    if (ob) { ob.click(); await sleep(300); }
    await cleanupSW();
    return W;
  }

  function D() { return frame.contentDocument; }
  function splashState() {
    var doc = D();
    var node = doc.getElementById("boot-splash");
    var booted = doc.body && doc.body.classList.contains("booted");
    var covering = false, topTag = "";
    try {
      var el = doc.elementFromPoint(Math.round(frame.clientWidth / 2), 200);
      topTag = el ? (el.tagName + (el.id ? "#" + el.id : "") + (el.className && el.className.baseVal === undefined ? "." + String(el.className).split(" ")[0] : "")) : "none";
      covering = !!(el && el.closest && el.closest("#boot-splash"));
    } catch (e) {}
    return { node: !!node, booted: booted, covering: covering, topTag: topTag };
  }
  function checkSplashAndErrors() {
    var s = splashState();
    check("boot splash removed from DOM", !s.node, "#boot-splash present=" + s.node + ", body.booted=" + s.booted);
    check("nothing from the splash covers the UI", !s.covering, "topmost element at (mid,200px) = " + s.topTag);
    check("no console/runtime errors", window.__qa.errors.length === 0,
      window.__qa.errors.length ? window.__qa.errors.slice(0, 6).join(" | ") : "0 errors");
  }
  function seed(W) {
    var OF = W.OF, U = OF.util, S = OF.storage;
    S.add("sleep", { date: U.todayISO(), durationMin: 360, quality: 2, bedTime: "01:00", wakeTime: "07:00" });
    [1, 2, 3].forEach(function (n) {
      S.add("sleep", { date: U.todayISO(-n), durationMin: 480, quality: 4, bedTime: "23:00", wakeTime: "07:00" });
    });
    [0, 1, 2].forEach(function (n) {
      S.add("exercise", { date: U.todayISO(-n), startTime: "07:00", durationMin: 60, performance: 4, type: "strength" });
    });
    OF.dashboard.refresh();
  }
  function tapRing() {
    var ring = D().querySelector('.hero-ring[data-nav="readiness"]');
    if (!ring) throw new Error("no .hero-ring[data-nav=readiness]");
    ring.click();
  }
  function modal() { return D().querySelector(".metric-modal"); }
  function modalOpen() { var m = modal(); return !!(m && !m.hidden); }
  function modalText() { var p = D().querySelector(".metric-modal-panel"); return p ? p.innerText.replace(/ /g, " ") : ""; }
  function toastText() {
    var t = D().querySelector(".toast, #toast, .of-toast");
    return t ? t.innerText : "";
  }
  function blurAll() { try { D().activeElement && D().activeElement.blur(); } catch (e) {} try { document.activeElement && document.activeElement.blur(); } catch (e) {} }
  function layout(showApp, showDump) {
    // visual stages get the whole screen for the app; the check log is only
    // rendered on the text stages (…t) so nothing squeezes the app viewport.
    logEl.hidden = !!showApp;
    frame.style.height = showApp ? "calc(100vh - " + (banner.offsetHeight + 2) + "px)" : "0px";
    frame.hidden = !showApp;
    dumpEl.hidden = !showDump;
  }

  function assertModalStructure(txt, ready) {
    var title = D().querySelector("#metric-modal-title");
    check('modal open (not a toast)', modalOpen(), "modal.hidden=" + (modal() ? modal().hidden : "no modal") + "; toast=\"" + toastText() + "\"");
    check('title is "Readiness"', title && title.textContent === "Readiness", 'got "' + (title ? title.textContent : "") + '"');
    check("ring with score rendered", !!D().querySelector(".metric-stats .rd-head svg"), "rd-head svg present");
    check("level line present", !!D().querySelector(".rd-level"), '"' + (D().querySelector(".rd-level") || {}).textContent + '"');
    check("verdict present", !!D().querySelector(".rd-verdict"), '"' + (D().querySelector(".rd-verdict") || {}).textContent + '"');
    check("explanation paragraph present", !!D().querySelector(".rd-explain"), (D().querySelector(".rd-explain") || {}).textContent ? "ok" : "");
    var adv = D().querySelectorAll(".rd-advice li");
    check('"How to raise it" list present', !!D().querySelector("h3.rd-h3") && adv.length > 0, adv.length + " advice items");
    var link = D().querySelector(".metric-modal-link");
    check('footer link "Ask my coach about this" -> #coach',
      !!link && link.textContent.trim() === "Ask my coach about this" && (link.getAttribute("href") || "") === "#coach",
      'text="' + (link ? link.textContent.trim() : "") + '" href="' + (link ? link.getAttribute("href") : "") + '"');
    if (ready) {
      var fac = D().querySelectorAll(".rd-factors li");
      check('"What moved it today" factor list', fac.length > 0 && /what moved it today/i.test(txt), fac.length + " factors");
      var marks = Array.prototype.map.call(fac, function (li) { var m = li.querySelector(".rd-mark"); return m ? m.textContent : "?"; }).join("");
      check("factors marked + / − / ·", /^[+−·]+$/.test(marks), "marks=" + marks);
      check("+N pts on at least one action", /\+\d+\s*pts/.test(txt), (txt.match(/\+\d+ pts/g) || []).join(","));
    }
  }

  async function run() {
    // boot the app in a full-height viewport for EVERY stage, so nothing is
    // measured or screenshotted in a squeezed frame
    logEl.hidden = true;
    frame.style.height = "calc(100vh - " + (banner.offsetHeight + 2) + "px)";
    var wiped = wipeStorage();
    log("stage=" + stage + " — wiped " + wiped + " optimalfit.* keys at start");
    await cleanupSW();

    /* ---------- 1 / 1t : FRESH, no data ---------- */
    if (stage === "1" || stage === "1t") {
      var W = await boot();
      checkSplashAndErrors();
      check("APP_VERSION", W.OF.APP_VERSION === "1.7.1 (build 57)", W.OF.APP_VERSION);
      tapRing();
      await sleep(400);
      var txt = modalText();
      assertModalStructure(txt, false);
      check('shows "NOT ENOUGH DATA YET"', /NOT ENOUGH DATA YET/.test(txt), (txt.split("\n")[1] || ""));
      check("advice tells the user to log sleep/workouts", /log/i.test(txt) && /sleep/i.test(txt) && /workout/i.test(txt),
        (D().querySelector(".rd-advice li") || {}).textContent || "");
      dumpEl.textContent = "=== FRESH modal innerText ===\n" + txt;
      blurAll();
      layout(stage === "1", stage === "1t");
    }

    /* ---------- 2 / 2t : WITH DATA ---------- */
    if (stage === "2" || stage === "2t") {
      var W2 = await boot();
      checkSplashAndErrors();
      seed(W2);
      await sleep(500);
      tapRing();
      await sleep(400);
      var txt2 = modalText();
      assertModalStructure(txt2, true);
      var scoreEl = D().querySelector(".rd-head .ring-value, .rd-head text, .rd-head .progress-ring-value");
      check("real numeric score in the ring", /\b\d{1,3}\b\s*\/\s*100|\d{1,3}\n\/100/.test(txt2) || /^\d+$/.test((scoreEl && scoreEl.textContent || "").trim()),
        "head text: " + txt2.split("\n").slice(0, 3).join(" | "));
      check("factor list includes a short-sleep line", /Slept only[\s\S]*under your[\s\S]*average/.test(txt2),
        (txt2.match(/Slept only[^\n]*/) || [""])[0]);
      var first = D().querySelector(".rd-advice li");
      var ft = first ? first.innerText : "";
      check("first action mentions sleeping less than your average",
        /less than your own average/i.test(ft), ft.slice(0, 120));
      check('first action carries "+20 pts"', /\+20\s*pts/.test(ft), (ft.match(/\+\d+ pts/) || [""])[0]);
      dumpEl.textContent = "=== SEEDED modal innerText ===\n" + txt2 +
        "\n\n=== advice items ===\n" + Array.prototype.map.call(D().querySelectorAll(".rd-advice li"), function (li, i) {
          return (i + 1) + ". [data-nav=" + (li.getAttribute("data-nav") || "none") + "] " + li.innerText;
        }).join("\n");
      blurAll();
      layout(stage === "2", stage === "2t");
    }

    /* ---------- 3 : advice item navigation ---------- */
    if (stage === "3") {
      var W3 = await boot();
      seed(W3);
      await sleep(400);
      tapRing();
      await sleep(300);
      var item = D().querySelector(".rd-advice li[data-nav]");
      check("an advice item carries data-nav", !!item, item ? 'data-nav="' + item.getAttribute("data-nav") + '"' : "none found");
      if (item) {
        var want = item.getAttribute("data-nav");
        var hashBefore = W3.location.hash;
        item.click();
        await sleep(900);
        var hashAfter = W3.location.hash;
        var visTab = (function () {
          var s = D().querySelectorAll("section.tab, .tab-panel, section[id]");
          var vis = [];
          Array.prototype.forEach.call(s, function (el) {
            if (el.id && !el.hidden && el.offsetParent !== null && /^(dashboard|sleep|food|exercise|body|insights|coach|settings|social)$/.test(el.id)) vis.push(el.id);
          });
          return vis.join(",");
        })();
        var stillOpen = modalOpen();
        check("tapping the advice item navigates to its tab (" + want + ")",
          hashAfter === "#" + want || visTab.indexOf(want) >= 0,
          "hash " + (hashBefore || "(none)") + " -> " + (hashAfter || "(none)") + "; visible tab(s)=" + (visTab || "none"));
        check("modal does not stay open blocking the tab", !stillOpen,
          "modal.hidden=" + (modal() ? modal().hidden : "?") + "; body.metal-open=" + D().body.classList.contains("metric-modal-open"));
        var blocker = "";
        try {
          var e2 = D().elementFromPoint(Math.round(frame.clientWidth / 2), 300);
          blocker = e2 ? (e2.tagName + (e2.className ? "." + String(e2.className).split(" ")[0] : "")) : "none";
        } catch (e) {}
        log("after tap: topmost element mid-screen = " + blocker);
        dumpEl.textContent = "hashBefore=" + hashBefore + "\nhashAfter=" + hashAfter +
          "\nvisibleTabs=" + visTab + "\nmodalOpen=" + stillOpen + "\ntopmostElement=" + blocker;
      }
      blurAll();
      layout(true, false);
    }

    /* ---------- 4 : closing the modal ---------- */
    if (stage === "4") {
      var W4 = await boot();
      seed(W4);
      await sleep(400);
      tapRing(); await sleep(250);
      var okOpen1 = modalOpen();
      D().querySelector(".metric-modal-close").click();
      await sleep(250);
      check("close (×) closes the modal", okOpen1 && !modalOpen(), "opened=" + okOpen1 + " nowOpen=" + modalOpen());
      tapRing(); await sleep(250);
      var ev = new W4.KeyboardEvent("keydown", { key: "Escape", bubbles: true });
      W4.document.dispatchEvent(ev);
      await sleep(250);
      check("Escape closes the modal", !modalOpen(), "nowOpen=" + modalOpen());
      tapRing(); await sleep(250);
      D().querySelector(".metric-modal-backdrop").click();
      await sleep(250);
      check("backdrop tap closes the modal", !modalOpen(), "nowOpen=" + modalOpen());
      check("body.metric-modal-open cleared", !D().body.classList.contains("metric-modal-open"), "");
      var dash = D().getElementById("dashboard");
      check("dashboard visible again", !!dash && dash.offsetParent !== null && !!D().querySelector(".hero-ring"),
        "hash=" + W4.location.hash);
      blurAll();
      layout(true, false);
    }

    /* ---------- 5 : regression smoke ---------- */
    if (stage === "5") {
      var W5 = await boot();
      checkSplashAndErrors();
      check('OF.APP_VERSION === "1.7.1 (build 57)"', W5.OF.APP_VERSION === "1.7.1 (build 57)", W5.OF.APP_VERSION);
      seed(W5);
      await sleep(400);
      var tc = D().getElementById("dash-trainer");
      check("trainer card renders", !!tc && tc.innerText.trim().length > 10,
        tc ? tc.innerText.trim().split("\n").slice(0, 3).join(" | ").slice(0, 140) : "no #dash-trainer");
      // Exercise tab: start a session, add a fresh Bench Press, read the rest chip
      W5.OF.app.showTab("exercise");
      await sleep(500);
      var startBtn = D().querySelector('[data-wo="start"]');
      if (startBtn) { startBtn.click(); await sleep(400); }
      var addIn = D().querySelector(".ex-add-input");
      var chipTxt = "";
      if (addIn) {
        addIn.value = "Bench Press";
        addIn.dispatchEvent(new W5.Event("input", { bubbles: true }));
        addIn.dispatchEvent(new W5.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
        await sleep(500);
        var chip = D().querySelector(".ex-rest-chip");
        chipTxt = chip ? chip.innerText.replace(/\s+/g, " ").trim() : "(no .ex-rest-chip)";
      } else { chipTxt = "(no .ex-add-input; start button " + (startBtn ? "clicked" : "missing") + ")"; }
      check('rest chip shows "⏱ 2:30 ✦" for a fresh Bench Press', /2:30/.test(chipTxt) && /✦/.test(chipTxt), 'got "' + chipTxt + '"');
      W5.OF.app.showTab("coach");
      await sleep(700);
      var coachSec = D().getElementById("coach");
      check("coach tab renders (no AI call sent)", !!coachSec && coachSec.offsetParent !== null && coachSec.innerText.trim().length > 20,
        coachSec ? coachSec.innerText.trim().split("\n").slice(0, 3).join(" | ").slice(0, 140) : "no #coach");
      W5.OF.app.showTab("dashboard");
      await sleep(400);
      check("no console/runtime errors during smoke", window.__qa.errors.length === 0,
        window.__qa.errors.slice(0, 6).join(" | ") || "0 errors");
      dumpEl.textContent = "trainer: " + (tc ? tc.innerText.trim().slice(0, 300) : "none") +
        "\n\nrestChip: " + chipTxt + "\nversion: " + W5.OF.APP_VERSION +
        "\nerrors: " + (window.__qa.errors.join(" | ") || "none");
      blurAll();
      layout(false, true);
    }

    /* ---------- 9 : teardown ---------- */
    if (stage === "9") {
      await cleanupSW();
      var left = wipeStorage();
      var remaining = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf("optimalfit.") === 0) remaining.push(k);
      }
      check("optimalfit.* localStorage cleared", remaining.length === 0, "removed " + left + ", remaining " + remaining.length);
      var regs = [];
      try { regs = await navigator.serviceWorker.getRegistrations(); } catch (e) {}
      var cacheNames = [];
      try { cacheNames = await caches.keys(); } catch (e) {}
      check("no service worker registrations left", regs.length === 0, "n=" + regs.length);
      check("no caches left", cacheNames.length === 0, cacheNames.join(",") || "none");
      layout(false, false);
    }

    // final error sweep for every stage
    if (window.__qa.errors.length) log("errors: " + window.__qa.errors.join(" | "), "bad");
    await cleanupSW();
    finish();
    if (QS.get("only") === "dump") { logEl.hidden = true; dumpEl.hidden = false; }
    if (stage === "1t" || stage === "2t" || stage === "5" || stage === "9") {
      // text-only stages: hide the frame entirely so the dump gets the screen
      frame.style.height = "0px"; frame.hidden = true;
    }
  }

  run().catch(function (e) {
    banner.className = "fail";
    banner.textContent = "stage " + stage + " — HARNESS ERROR: " + (e && e.message || e);
    log(String(e && e.stack || e), "bad");
  });
})();
</script>
</body>
</html>
